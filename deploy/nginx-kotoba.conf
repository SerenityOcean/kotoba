# HTTPS 版。注意这份配置引用了 /etc/letsencrypt/live/ 下的证书文件，
# 必须先用 certbot 签出证书，nginx -t 才过得去 —— 顺序见 deploy/README.md。

server {
    listen 80;
    listen [::]:80;
    server_name kotoba.work www.kotoba.work;

    # Let's Encrypt 的续期验证走 HTTP，这一段不能跳转，否则 90 天后续期失败，
    # 而且会失败得很安静 —— 直到证书过期用户才发现
    location /.well-known/acme-challenge/ {
        root /var/www/kotoba;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 写在 listen 上而不是用独立的 `http2 on;` —— 后者要 nginx 1.25.1+，
    # Ubuntu 24.04 自带的是 1.24，会报 unknown directive
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kotoba.work www.kotoba.work;

    ssl_certificate     /etc/letsencrypt/live/kotoba.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kotoba.work/privkey.pem;

    # 不 include certbot 那几个文件：那是 python3-certbot-nginx 装的，
    # 我们用 certonly 不一定有。写在这儿也更清楚跑的是什么
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：告诉浏览器以后只准用 HTTPS。确认 HTTPS 稳定跑几天再打开 ——
    # 一旦下发，浏览器会记住 max-age 这么久，期间你没法退回 HTTP
    # add_header Strict-Transport-Security "max-age=15552000" always;

    root /var/www/kotoba;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 拆解和注音要等模型生成，默认的 60 秒不够长句子用。
        # 必须比后端自己的模型超时（analyze.openai.timeout-seconds）大 ——
        # 否则 nginx 先放弃，用户看到的是裸的 504，而后端还在傻等、
        # token 照烧，错误信息全丢了。
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 带内容哈希的产物：文件名变了内容才会变，可以永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 是入口，它决定加载哪个 bundle —— 一旦被缓存，
    # 用户会连着旧 html 和旧 js 一起用，页面看着正常但跑的是旧代码，
    # 而且察觉不到。这个文件必须每次都回源校验。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
