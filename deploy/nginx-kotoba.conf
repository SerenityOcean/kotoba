server {
    listen 80 default_server;
    server_name _;

    root /var/www/kotoba;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 拆解和注音要等模型生成，默认的 60 秒不够长句子用。
        # 必须比后端自己的模型超时（analyze.openai.timeout-seconds）大 ——
        # 否则 nginx 先放弃，用户看到的是裸的 504，而后端还在傻等、
        # token 照烧，错误信息全丢了。
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 带内容哈希的产物：文件名变了内容才会变，可以永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 是入口，它决定加载哪个 bundle —— 一旦被缓存，
    # 用户会连着旧 html 和旧 js 一起用，页面看着正常但跑的是旧代码，
    # 而且察觉不到。这个文件必须每次都回源校验。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
