# 安全响应头。服务器上放在 /etc/nginx/snippets/kotoba-security-headers.conf，
# 被 nginx-kotoba.conf 的 server 块和带自己 add_header 的 location 块 include ——
# nginx 的 add_header 不会继承：location 里只要写了一条，server 级的就全丢了。

# 只准 HTTPS。HTTPS 已经稳定跑了，后端也一直在发同样的头
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# 不许被别的站嵌进 iframe（点击劫持）
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 所有资源都是自己的。wasm-unsafe-eval 给 Anki 导入用的 sql.js（WebAssembly）；
# img-src 的 data: 给 CSS 里内联的噪点纹理。加外部资源（字体、统计脚本）要改这里
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://*.alipay.com https://*.alipaydev.com; frame-ancestors 'none'" always;
