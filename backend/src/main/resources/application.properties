spring.application.name=kotoba

spring.datasource.url=jdbc:postgresql://localhost:5432/kotoba
spring.datasource.username=kotoba
spring.datasource.password=kotoba_dev_pw

# schema 交给 Flyway 管，Hibernate 只做校验
spring.jpa.hibernate.ddl-auto=validate
# 每条 SQL 打到标准输出。线上会全进 journal，默认关；本地想看设 JPA_SHOW_SQL=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 登录会话：30 天免登录，cookie 只走 HTTP（JS 读不到）。
# 会话存在 Postgres 的 spring_session 表里（Spring Session JDBC），重启/发版不会把人踢下线；
# 表由 Flyway 的 V6 建，不让它自己建。过期会话每分钟清一次（spring.session.jdbc.cleanup-cron）。
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
# Lax 而不是 Strict：GitHub 登录回跳是跨站导航，Strict 会让 cookie 带不回来。
# Lax 之下 CSRF 靠令牌挡（SecurityConfig 里的 csrf.spa()），两边要一起改。
server.servlet.session.cookie.same-site=lax
# 只在 HTTPS 下发送会话 cookie。本地开发是 http，写死 true 会导致登录不上，
# 所以做成环境变量：生产的 .env 里设 COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# 后端在 nginx 后面：让 request.getRemoteAddr() 拿到 X-Forwarded-For 里的真实 IP，
# 限流才不会把所有人都算成 127.0.0.1。只信任本机/内网来的转发头，外面伪造的不认。
server.forward-headers-strategy=native
# 生产环境在 .env 里设 SERVER_ADDRESS=127.0.0.1，只让 nginx 从本机连进来，
# 不靠云防火墙挡 8080。本地开发不设：vite 代理连 localhost 可能走 IPv6，绑死 127.0.0.1 会连不上。

# 用户浏览器里看到的站点地址。邮件里的链接、GitHub 的回调地址都从它拼。
app.base-url=${APP_BASE_URL:http://localhost:5173}

# 找回密码 / 绑定邮箱要发信。SMTP 没配（MAIL_HOST 为空）时这两个功能自动关掉；
# 本地开发想走通流程，设 MAIL_LOG_LINKS=true，链接会打在日志里。
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtps}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
auth.mail.from=${MAIL_FROM:}
auth.mail.log-links=${MAIL_LOG_LINKS:false}

# self（/self）的随笔谁都能读，只有这个用户名能写。设成空就谁都写不了。
self.owner=${SELF_OWNER:keshi}

# GitHub 登录。去 GitHub → Settings → Developer settings → OAuth Apps 建一个，
# callback URL 填 ${APP_BASE_URL}/api/login/oauth2/code/github。没配 id 就不开。
auth.github.client-id=${GITHUB_CLIENT_ID:}
auth.github.client-secret=${GITHUB_CLIENT_SECRET:}

# AI 拆解（POST /api/analyze）。key 只从环境变量读，别写进这个文件。
# 没配 key 时这个功能自动关掉（接口回 503），其余功能照常。
# 注音、补读音不走模型（查本地的 Kuromoji 词典），跟这里的配置无关。
#
# provider=openai     走 OpenAI 兼容的 /chat/completions —— 百炼（通义）、
#                     DeepSeek、智谱都是这一套，区别只在 base-url 和 model
# provider=anthropic  走 Anthropic 官方 SDK
analyze.provider=${ANALYZE_PROVIDER:openai}

# base-url 填到 /v1 为止，不要带 /chat/completions。
# 百炼的地址带工作空间 id，在控制台创建 key 的页面能看到。
# DeepSeek：base-url=https://api.deepseek.com，model=deepseek-flash。
analyze.openai.base-url=${ANALYZE_BASE_URL:}
analyze.openai.api-key=${ANALYZE_API_KEY:}
analyze.openai.model=${ANALYZE_MODEL:qwen3.7-plus}
# 等模型的上限。要小于 nginx 的 proxy_read_timeout（见 deploy/nginx-kotoba.conf），
# 这样超时的时候前端拿到的是这边的中文提示，而不是 nginx 的 504
analyze.openai.timeout-seconds=${ANALYZE_TIMEOUT_SECONDS:90}
# 思考模式：false 明显更快（思考 token 占生成时间的大头），而且关掉之后
# 才能强制指定函数、结构更稳；true 语法分析更深。留空则不发这个字段，用服务端默认
# （DeepSeek 默认是开着的）。开关字段 qwen 和 DeepSeek 不一样，按 base-url 自动选。
analyze.openai.thinking=${ANALYZE_THINKING:false}

analyze.anthropic.api-key=${ANTHROPIC_API_KEY:}
analyze.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}

# 拆解配额（见 AnalyzeQuota）：注册是开放的，不设上限的话谁都能刷你的模型余额。
# 每分钟那档不能太小 —— 拆解页一段话按句并行发，最多 20 句。
analyze.limit.per-user-per-minute=${ANALYZE_LIMIT_PER_MINUTE:30}
analyze.limit.per-user-per-day=${ANALYZE_LIMIT_PER_DAY:300}
analyze.limit.global-per-day=${ANALYZE_LIMIT_GLOBAL_PER_DAY:2000}
# 体验账号所有访客合用的那一份（见下面 demo.username）
analyze.limit.demo-per-day=${ANALYZE_LIMIT_DEMO_PER_DAY:20}

# 共用的体验账号：展示页「用演示账号进去」登进的就是它，只能看不能改（见 DemoGuardFilter）。
# 填 demo/seed.py 建好的一个号，比如 demo_n4。留空就不开，展示页上不显示那个按钮。
demo.username=${DEMO_USERNAME:}

# 资料包的支付宝收款（电脑网站支付 + 手机网站支付）。三样都配了才开，没配时资料包页
# 不出现「用支付宝解锁」，兑换码照常能用。钥匙只从环境变量读，别写进这个文件。
#
# 开发用沙箱：开放平台 → 控制台 → 沙箱，个人支付宝账号就能用，不要营业执照。
#   ALIPAY_GATEWAY=https://openapi-sandbox.dl.alipaydev.com/gateway.do
# 正式环境签约「电脑网站支付」「手机网站支付」之后，换掉 app-id 和三样钥匙、去掉 ALIPAY_GATEWAY。
#
# private-key 是自己的应用私钥（PKCS8，支付宝密钥工具里选「Java 适用」）；
# alipay-public-key 是开放平台给的支付宝公钥，不是自己的应用公钥。
# 异步通知发到 ${app.base-url}/api/pay/alipay/notify；本地开发支付宝连不上，靠前端轮询时的主动查单。
pay.alipay.app-id=${ALIPAY_APP_ID:}
pay.alipay.private-key=${ALIPAY_PRIVATE_KEY:}
pay.alipay.alipay-public-key=${ALIPAY_PUBLIC_KEY:}
pay.alipay.gateway=${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
